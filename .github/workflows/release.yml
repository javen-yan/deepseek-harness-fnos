name: Release FPK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish. Defaults to v<manifest version>."
        required: false
        type: string

permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build Linux runtime archives
        run: TARGET_ARCH=all ./scripts/build-runtime.sh

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v7
        with:
          name: runtime
          path: |
            dist/runtime/runtime-linux-*.tgz
            dist/runtime/runtime-linux-*.tgz.sha256

  fpk:
    runs-on: macos-14
    needs:
      - runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download runtime artifacts
        uses: actions/download-artifact@v8
        with:
          name: runtime
          path: dist/runtime

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(awk -F= '$1 == "version" { print $2 }' manifest)"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install fnpack
        run: |
          set -euo pipefail
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          case "$ARCH" in
            arm64|aarch64) ARCH="arm64" ;;
            x86_64|amd64) ARCH="amd64" ;;
            *) echo "Unsupported runner arch: $ARCH" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/fnpack"
          curl -fsSL "https://static2.fnnas.com/fnpack/fnpack-1.2.3-${OS}-${ARCH}" -o "$RUNNER_TEMP/fnpack/fnpack"
          chmod +x "$RUNNER_TEMP/fnpack/fnpack"
          echo "FNPACK_BIN=$RUNNER_TEMP/fnpack/fnpack" >> "$GITHUB_ENV"

      - name: Build x86 FPK
        run: TARGET_PLATFORM=x86 ./scripts/build-fpk.sh

      - name: Build arm FPK
        run: TARGET_PLATFORM=arm ./scripts/build-fpk.sh

      - name: Upload FPK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fpk
          path: dist/deepseek_harness-*.fpk

  release:
    runs-on: ubuntu-latest
    needs:
      - runtime
      - fpk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(awk -F= '$1 == "version" { print $2 }' manifest)"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: release-assets/**/*
